<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head(${titulo})}"></head>
<body>
<header th:replace="~{fragments :: menu('clientes')}"></header>
<main class="conteudo estreito">
    <h1 th:text="${titulo}">Cliente</h1>
    <div th:replace="~{fragments :: alertas}"></div>

    <form class="formulario" th:action="@{${acao}}" th:object="${form}" method="post" novalidate>
        <label>Nome
            <input type="text" th:field="*{nome}" maxlength="120" autofocus>
        </label>
        <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

        <label>CPF (somente números)
            <input type="text" th:field="*{cpf}" maxlength="11" inputmode="numeric">
        </label>
        <span class="erro-campo" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>

        <label>E-mail
            <input type="email" th:field="*{email}" maxlength="150">
        </label>
        <span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <div class="botoes">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao secundario" th:href="@{/clientes}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
</body>
</html>
