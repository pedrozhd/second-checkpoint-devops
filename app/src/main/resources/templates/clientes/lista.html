<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Clientes')}"></head>
<body>
<header th:replace="~{fragments :: menu('clientes')}"></header>
<main class="conteudo">
    <div class="cabecalho-pagina">
        <h1>Clientes</h1>
        <a class="botao" th:href="@{/clientes/novo}">+ Novo cliente</a>
    </div>
    <div th:replace="~{fragments :: alertas}"></div>

    <p class="vazio" th:if="${#lists.isEmpty(clientes)}">Nenhum cliente cadastrado.</p>

    <table class="tabela" th:unless="${#lists.isEmpty(clientes)}">
        <thead>
        <tr><th>ID</th><th>Nome</th><th>CPF</th><th>E-mail</th><th>Cadastro</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.idCliente}">1</td>
            <td th:text="${c.nome}">Nome</td>
            <td th:text="${c.cpf}">00000000000</td>
            <td th:text="${c.email}">email</td>
            <td th:text="${#temporals.format(c.dataCadastro, 'dd/MM/yyyy HH:mm')}">01/01/2026 00:00</td>
            <td class="acoes">
                <a class="botao secundario" th:href="@{/clientes/{id}/editar(id=${c.idCliente})}">Editar</a>
                <form th:action="@{/clientes/{id}/excluir(id=${c.idCliente})}" method="post"
                      onsubmit="return confirm('Excluir este cliente?');">
                    <button type="submit" class="botao perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
</body>
</html>
