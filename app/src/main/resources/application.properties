# =====================================================================
# Projeto DimDim - Grupo lupeol
#
# Nenhum valor default para credenciais: URL, usuario e senha chegam por
# variavel de ambiente. No App Service, a senha e uma Key Vault reference
# resolvida pela Managed Identity (ver scripts/06_webapp.sh).
# Sem as variaveis, a aplicacao nao sobe.
# =====================================================================

spring.application.name=dimdim

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O DDL e responsabilidade de scripts/DDL.sql. O Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Todo texto no banco e NVARCHAR. Sem isto o validate espera varchar e
# recusa subir.
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# O gateway do Azure SQL derruba conexao ociosa; o pool renova antes.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# O App Service Java SE informa a porta em PORT; localmente, 8080.
server.port=${PORT:8080}
